[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "otp-giar"
version = "1.0.0"
description = "SDK and CLI for giar otp: share self-destructing, end-to-end encrypted secrets from code and CI pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GIAR Digital" }]
keywords = ["secret", "one-time-secret", "password-sharing", "end-to-end-encryption", "self-destructing", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://otp.giar.digital"
Documentation = "https://otp.giar.digital/docs"
Source = "https://github.com/thegiommi/otp-giar"
Issues = "https://github.com/thegiommi/otp-giar/issues"

[project.scripts]
otp-giar = "otp_giar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["otp_giar"]

[tool.hatch.build.targets.sdist]
include = ["otp_giar", "tests", "README.md", "LICENSE"]
