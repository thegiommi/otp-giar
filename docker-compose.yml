services:
  otp:
    build: .
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Behind a reverse proxy, set ADDRESS_HEADER=X-Forwarded-For so rate limits see the client IP.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
    volumes:
      - otp-data:/data

volumes:
  otp-data:
